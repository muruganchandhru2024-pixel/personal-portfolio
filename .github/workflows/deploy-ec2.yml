name: Deploy Portfolio to AWS EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017562255736:role/GitHubActions-EC2-Deploy
          aws-region: eu-north-1

      - name: Deploy using AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-099bf9177944e0a7a" \
            --document-name "AWS-RunShellScript" \
            --comment "Portfolio automatic deployment" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/portfolio",
              "sudo -u ubuntu git pull --ff-only origin main",
              "docker build -t portfolio-img .",
              "docker rm -f portfolio || true",
              "docker run -d --name portfolio --restart unless-stopped -p 5000:80 portfolio-img",
              "sleep 5",
              "curl -f http://localhost:5000"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-099bf9177944e0a7a" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                exit 1
                ;;
            esac

            sleep 10
          done

          exit 1
